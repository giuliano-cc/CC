<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PrintFlow</title>
    <!-- Fonts selectable in the builder (Style -> Font family) are
         self-hosted (see src/styles/builderFonts.css, imported from
         main.jsx) rather than loaded from the Google Fonts CDN: the exact
         same local files utils/pdfFontEmbed.js embeds into the exported
         PDF, so screen and print are guaranteed to use the same glyphs
         instead of two independent fetches of "the same name" that can
         drift apart, and the builder works fully offline. Inter/Arimo/
         Tinos/Cousine/Gelasio stand in for the "system font" options
         (Inter itself, Arial, Times New Roman, Courier New, Georgia) —
         Arimo/Tinos/Cousine/Gelasio are Google's own metric-compatible
         clones of Arial/Times New Roman/Courier New/Georgia, so choosing
         one of those options still looks like that typeface. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
